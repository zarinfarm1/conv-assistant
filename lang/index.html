function toast(msg,ms=3800){

function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);

/* ============ CLOUDFLARE SYNC ============ */
let syncKey=null, syncTimer=null, syncEnabled=false;
function updateSyncUI(){
  const badge=$('#syncBadge');if(!badge)return;
  if(!settings.proxy||!settings.syncCode){badge.style.display='none';return}
  badge.style.display='flex';
  const dot=$('#syncDot'),label=$('#syncLabel');
  if(!dot||!label)return;
  dot.className='sync-dot '+(syncEnabled?'on':'off');
  label.textContent=syncEnabled?'متصل':'آفلاین';
}
async function computeSyncKey(code){
  const data=new TextEncoder().encode('zabanyar-v1:'+code);
  const hash=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,32);
}
async function initSync(){
  if(!settings.proxy||!settings.syncCode)return false;
  try{syncKey=await computeSyncKey(settings.syncCode);syncEnabled=true;updateSyncUI();return true}
  catch(e){console.error('Sync init error:',e);return false}
}
async function pushToCloud(){
  if(!syncEnabled||!syncKey)return;
  try{
    const base=settings.proxy.replace(/\/+$/,'');
    const payload={prog,lessonCache,mistakes,updatedAt:Date.now()};
    const r=await fetch(base+'/sync/'+syncKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const dot=$('#syncDot');if(dot)dot.className='sync-dot on';
  }catch(e){console.error('Push error:',e);toast('خطا در ذخیره: '+e.message,5000)}
}
async function pullFromCloud(silent){
  if(!syncEnabled||!syncKey)return false;
  try{
    const base=settings.proxy.replace(/\/+$/,'');
    const r=await fetch(base+'/sync/'+syncKey);
    if(r.status===404){await pushToCloud();if(!silent)toast('پیشرفت محلی به ابر فرستاده شد ✅');return true}
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(d.prog){prog=d.prog;if(!prog.program)prog.program={};store.set('zy_prog',prog);updateStats()}
    if(d.lessonCache){lessonCache=d.lessonCache;store.set('zy_lessons',lessonCache)}
    if(d.mistakes){mistakes=d.mistakes;store.set('zy_mistakes',mistakes)}
    if(!silent)toast('پیشرفت از ابر بارگذاری شد ✅');
    render();return true;
  }catch(e){console.error('Pull error:',e);if(!silent)toast('خطا: '+e.message,5000);return false}
}
function schedulePushToCloud(){
  if(!syncEnabled||!settings.syncAuto)return;
  clearTimeout(syncTimer);
  const dot=$('#syncDot');if(dot)dot.className='sync-dot pending';
  syncTimer=setTimeout(pushToCloud,1500);
}
function exportData(){
  const data={v:1,exportedAt:new Date().toISOString(),prog,lessonCache,mistakes};
  return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}
function importData(b64){
  const json=decodeURIComponent(escape(atob(b64.trim())));
  const data=JSON.parse(json);
  if(data.prog){prog=data.prog;if(!prog.program)prog.program={};store.set('zy_prog',prog);updateStats()}
  if(data.lessonCache){lessonCache=data.lessonCache;store.set('zy_lessons',lessonCache)}
  if(data.mistakes){mistakes=data.mistakes;store.set('zy_mistakes',mistakes)}
  return true;
}

/* ============ 1xai API ============ */
async function callAI(system,messages,max=1500){
  if(!settings.key)throw new Error('NOKEY');
  const baseUrl=(settings.proxy&&settings.proxy.trim())?settings.proxy.trim().replace(/\/+$/,''):'https://1xai.ir';
  const r=await fetch(baseUrl+'/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.key},
    body:JSON.stringify({model:settings.model,max_tokens:max,messages:[{role:'system',content:system},...messages]})
  });
  if(!r.ok){let m='';try{const d=await r.json();m=d.error?.message||d.error||''}catch(e){}throw new Error(r.status+(m?' — '+m:''))}
  const d=await r.json();
  return (d.choices?.[0]?.message?.content||'').trim();
}
function parseJSON(t){t=t.replace(/```json|```/g,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<0)throw new Error('bad json');return JSON.parse(t.slice(a,b+1))}
function errText(e){
  if(e.message==='NOKEY')return 'اول کلید API را در «تنظیمات» وارد کنید.';
  if(/Failed to fetch/i.test(e.message))return 'اتصال به سرور برقرار نشد. آدرس پروکسی را در تنظیمات وارد کنید.';
  return 'خطا: '+e.message;
}

/* ============ speech ============ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let voices=[];
function loadVoices(){if('speechSynthesis' in window)voices=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('en'))}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}
function speak(text,onend,pitch=1){
  if(!('speechSynthesis' in window)){onend&&onend();return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.pitch=pitch;
  const v=voices.find(v=>v.name===settings.voice)||voices.find(v=>v.lang==='en-US')||voices[0];if(v)u.voice=v;
  u.rate={slow:0.72,normal:0.95,fast:1.15}[settings.rate]||0.9;
  let fin=false;const end=()=>{if(!fin){fin=true;onend&&onend()}};
  u.onend=end;u.onerror=end;speechSynthesis.speak(u);
}
function listen({interim,done}){
  if(!SR){toast('این مرورگر تشخیص گفتار ندارد.');return null}
  if('speechSynthesis' in window)speechSynthesis.cancel();
  const r=new SR();r.lang='en-US';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
  let text='',conf=null;
  r.onresult=e=>{let t='',c=null;for(let i=0;i<e.results.length;i++){t+=e.results[i][0].transcript+' ';c=e.results[i][0].confidence}text=t.trim();conf=c;interim&&interim(text)};
  r.onerror=e=>{if(e.error==='not-allowed')toast('دسترسی به میکروفون داده نشد.')};
  r.onend=()=>done&&done(text,conf);
  try{r.start()}catch(e){return null}
  return r;
}
function practiceWord(en,btn){
  const out=btn.closest('.vc').querySelector('.pr');
  if(btn.classList.contains('rec')){rec&&rec.stop();return}
  btn.classList.add('rec');out.className='pr';out.textContent='در حال گوش دادن…';
  rec=listen({done:(t)=>{
    btn.classList.remove('rec');
    const a=norm(t),b=norm(en);
    if(!a){out.textContent='';return}
    const ok=a===b||a.includes(b)||sim(a,b)>=0.8;
    out.className='pr '+(ok?'ok':'no');
    out.textContent=ok?'تلفظ عالی بود!':'شنیده شد: «'+t+'»';
    if(ok)award(1);
  }});
  if(!rec)btn.classList.remove('rec');
}

function taskKey(type,id){return type+':'+id}
function isTaskDone(type,id){return !!(prog.program && prog.program[taskKey(type,id)])}
function toggleTask(type,id){
  if(!prog.program) prog.program={};
  const k=taskKey(type,id);
  if(prog.program[k]){delete prog.program[k]}
  else{prog.program[k]=Date.now();award(3)}
  saveProg();
  renderProgram();
}
function weekProgress(w){
  const p=PROGRAM.find(x=>x.week===w);
  if(!p)return 0;
  const total=p.lessons.length+p.scenarios.length;
  let done=0;
  p.lessons.forEach(l=>{if(isTaskDone('les',l.level+':'+l.idx))done++});
  p.scenarios.forEach(s=>{if(isTaskDone('sc',s.id))done++});
  return total?Math.round(done*100/total):0;
}
function isWeekDone(w){return weekProgress(w)===100}

const LESSON_SYS=`You are an expert EFL curriculum designer for Persian speakers. Create ONE lesson as strict JSON (no markdown).
Schema: {"title":string,"intro_fa":string,"vocab":[{"en":string,"say":string,"fa":string,"ex":string,"ex_fa":string}],"grammar":{"title":string,"explain_fa":string,"rules":[string],"examples":[{"en":string,"fa":string}]},"dialogue":[{"speaker":"A"|"B","en":string,"fa":string}],"phrases":[{"en":string,"fa":string}],"quiz":[{"q":string,"options":[string,string,string,string],"answer":number,"why_fa":string}],"speaking_goal":string}
Rules: exactly 10 vocab, "say" for A1-A2, grammar in Persian, dialogue 6-8 lines, 5 phrases, 6 quiz (0-based answer), all Persian explanations, valid JSON.`;

function openLesson(level,idx){
  const id=unitId(level,idx), unit=LEVELS.find(l=>l.id===level).units[idx];
  const cached=lessonCache[id];
  const hasLesson=(id==='A1-0')||!!cached;
  lessonCtx={id,level,idx,unit,lesson:(id==='A1-0')?DEMO:(cached||null),step:'learn',loading:!hasLesson,err:null,quizDone:false};
  go('lesson');
  if(!hasLesson)genLesson();
}
async function genLesson(){
  const C=lessonCtx;if(!C)return;
  C.loading=true;C.err=null;render();
  try{
    const raw=await callAI(LESSON_SYS,[{role:'user',content:`CEFR: ${C.level}\nUnit: "${C.unit[0]}" (${C.unit[1]})\nFocus: ${C.unit[2]}`}],5000);
    const j=parseJSON(raw);
    if(!j.vocab||!j.quiz)throw new Error('incomplete lesson');
    lessonCache[C.id]=j;store.set('zy_lessons',lessonCache);C.lesson=j;
    schedulePushToCloud();
  }catch(e){C.err=errText(e)}
  C.loading=false;if(view==='lesson'&&lessonCtx===C)render();
}

function bindQuiz(root,quiz,done){
  let answered=0,score=0;
  $$('.q',root).forEach(qe=>{

    $$('.opt',qe).forEach(b=>b.onclick=()=>{

      $('.why',qe).textContent=(ok?'درست! ':'نه دقیقاً. ')+(q.why_fa||'');
      if(++answered===quiz.length)done(score,quiz.length);
    });
  });
}

  if(job.view==='cats'){
    let h=`<h1>حالت شغلی</h1><p class="sub">سناریوهای واقعی کار.</p>
    <div class="job-cat">`;
    JOB_CATS.forEach(c=>{
      const cnt=JOB_SCENARIOS.filter(s=>s.cat===c.id).length;
      h+=`<button class="job-card" data-cat="${c.id}">
        <div class="jc-ic">${ic(c.icon)}</div>
        <div class="jc-t">${esc(c.name)}</div>
        <div class="jc-c">${esc(c.desc)}</div>
        <div class="jc-n">${fa(cnt)} سناریو</div>
      </button>`;
    });
    h+=`</div>`;
    h+=`<div class="card" style="margin-top:20px;text-align:center">
      <b>دنبال تمرین ساختاریافته‌ای؟</b>
      <p class="sub" style="margin:8px 0">برنامه‌ی ۸ هفته‌ای، دقیقاً می‌گه کی چی تمرین کنی.</p>
      <button class="btn prog" id="toProg">${ic('cal')} برو به برنامه من</button>
    </div>`;
    el.innerHTML=h;
    $$('.job-card').forEach(b=>b.onclick=()=>{job.view='list';job.catId=b.dataset.cat;renderJob()});
    const tp=$('#toProg');if(tp)tp.onclick=()=>go('program');
    return;
  }
  if(job.view==='list'){
    const cat=JOB_CATS.find(c=>c.id===job.catId);
    const list=JOB_SCENARIOS.filter(s=>s.cat===job.catId);
    let h=`<button class="link" id="jback">← بازگشت</button>
    <h1>${esc(cat.name)}</h1><p class="sub">${esc(cat.desc)}</p>
    <div class="scenario-list">`;
    list.forEach(s=>{
      const done=prog.done['job-'+s.id];
      h+=`<button class="scenario" data-sc="${s.id}">
        <span class="sc-ic">${done?'✓':'▶'}</span>
        <span><div class="sc-t">${esc(s.title)}</div><div class="sc-d">${esc(s.desc)}</div></span>
        <span class="sc-a">${done?'✓':'›'}</span>
      </button>`;
    });
    h+=`</div>`;
    el.innerHTML=h;
    $('#jback').onclick=()=>{job.view='cats';renderJob()};
    $$('.scenario').forEach(b=>b.onclick=()=>startJobScenario(b.dataset.sc));
    return;
  }
  renderJobPlay();
}

function startJobScenario(id){
  const sc=JOB_SCENARIOS.find(s=>s.id===id);
  if(!sc)return;
  job.scenario=sc;
  job.history=[];
  job.turns=[{role:'ai',text:sc.opening,fa:''}];
  job.busy=false;job.count=0;job.done=false;job.view='play';
  go('job');
  if(settings.autoplay)speak(sc.opening);
}
function renderJobPlay(){
  const sc=job.scenario;
  let h=`<button class="link" id="jback2">← بازگشت</button>
  <div class="thead">
    <div><span class="pill job">${esc(sc.roleFa)}</span> <b>${esc(sc.title)}</b><div class="sub" style="font-size:.85rem">${esc(sc.desc)}</div></div>
    <div class="row">
      <button class="btn ghost" id="jRestart">شروع دوباره</button>
      <button class="btn ghost" id="jHint">💡 راهنما</button>
    </div>
  </div>
  <div class="toggles" style="margin-bottom:12px">
    <label><input type="checkbox" id="j-auto" ${settings.autoplay?'checked':''}> پخش صدا</label>
    <label><input type="checkbox" id="j-analyze" ${settings.jobAnalyze?'checked':''}> نمایش تحلیل</label>
    <label><input type="checkbox" id="j-fa" ${settings.jobShowFa?'checked':''}> ترجمه</label>
    <label><input type="checkbox" id="j-hands" ${settings.hands?'checked':''}> دست‌آزاد</label>
  </div>
  <div class="chat" id="chat">${job.turns.map(jobBubble).join('')}</div>
  <div id="report"></div>
  <div class="composer">
    <div class="hint">به انگلیسی جواب بده. کوتاه و طبیعی.</div>
    <div class="cbox">
      <button class="mic job-mic ${listening?'rec':''}" id="mic">${ic('mic')}</button>
      <input type="text" id="msg" dir="ltr" placeholder="Type your reply in English…" autocomplete="off">
      <button class="send" id="sendB">${ic('send')}</button>
    </div>
  </div>`;
  $('#main').innerHTML=h;
  $('#jback2').onclick=()=>{job.view='list';renderJob()};
  $('#jRestart').onclick=()=>startJobScenario(sc.id);
  $('#jHint').onclick=()=>toast('💡 '+sc.hint,6000);
  $('#j-auto').onchange=e=>{settings.autoplay=e.target.checked;store.set('zy_settings',settings)};
  $('#j-analyze').onchange=e=>{settings.jobAnalyze=e.target.checked;store.set('zy_settings',settings);renderJobPlay()};
  $('#j-fa').onchange=e=>{settings.jobShowFa=e.target.checked;store.set('zy_settings',settings);renderJobPlay()};
  $('#j-hands').onchange=e=>{settings.hands=e.target.checked;store.set('zy_settings',settings)};
  $('#mic').onclick=toggleJobMic;
  $('#sendB').onclick=()=>sendJob($('#msg').value,null,false);
  $('#msg').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendJob($('#msg').value,null,false)}};
  drawJobChat();
}
function jobBubble(t){
  if(t.role==='ai')return `<div class="b job-ai"><div class="bt" dir="ltr">${esc(t.text)}</div>${settings.jobShowFa&&t.fa?`<div class="fa">${esc(t.fa)}</div>`:''}<button class="mini" data-say="${esc(t.text)}">${ic('vol')}</button></div>`;
  return `<div class="b job-me"><div class="bt" dir="ltr">${esc(t.text)}</div></div>${t.err?'<div class="an">ارسال نشد.</div>':(settings.jobAnalyze?jobAnalysisHTML(t):'')}`;
}
function jobAnalysisHTML(t){
  if(t.pending)return `<div class="an"><span class="dots"><i></i><i></i><i></i></span> در حال تحلیل…</div>`;
  const a=t.an;if(!a)return '';
  const ms=a.mistakes||[];
  let h=`<div class="an"><div class="an-top">`;
  h+=a.is_correct&&!ms.length?'<span class="pill ok">عالی بود</span>':'<span class="pill warn">قابل بهتر شدن</span>';
  if(a.score!=null)h+=`<span class="sc">امتیاز <b>${a.score}</b>/10</span>`;
  if(a.brevity_note)h+=`<span class="sc">طول: <b>${a.brevity_note==='too long'?'زیاد':a.brevity_note==='too short'?'کم':'خوب'}</b></span>`;
  h+=`</div>`;
  if(a.corrected&&a.corrected.trim()&&norm(a.corrected)!==norm(t.text))h+=`<div class="fix"><span>✓</span><span dir="ltr">${esc(a.corrected)}</span><button class="mini" data-say="${esc(a.corrected)}">${ic('vol')}</button></div>`;
  h+=ms.map(m=>`<div class="mk"><div dir="ltr"><s>${esc(m.original)}</s> → <b>${esc(m.fix)}</b> <span class="ty">${esc(m.type||'')}</span></div><div>${esc(m.explain_fa||'')}</div></div>`).join('');
  if(a.tip_fa)h+=`<div class="tip">💡 ${esc(a.tip_fa)}</div>`;
  return h+`</div>`;
}
function drawJobChat(){
  const c=$('#chat');if(!c||view!=='job')return;
  c.innerHTML=job.turns.map(jobBubble).join('');
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
async function sendJob(text,conf,voice){
  text=(text||'').trim();if(!text||job.busy||job.done)return;
  const m=$('#msg');if(m)m.value='';
  const ut={role:'me',text,pending:true};
  job.turns.push(ut);job.count++;
  job.busy=true;drawJobChat();
  try{
    const history=job.turns.filter(t=>t.role!=='me'||!t.pending).map(t=>({role:t.role==='ai'?'assistant':'user',content:t.text}));
    history.push({role:'user',content:text});
    const sys='Follow the rules strictly. Return ONLY valid JSON.\n\n'+jobSystemPrompt();
    const raw=await callAI(sys,history.slice(-12),1400);
    let j;try{j=parseJSON(raw)}catch(e){j={reply:raw,reply_fa:'',analysis:{is_correct:true,mistakes:[]}}}
    ut.pending=false;ut.an=j.analysis||{is_correct:true};
    saveJobMistakes(j.analysis);
    if(j.reply)job.turns.push({role:'ai',text:j.reply,fa:j.reply_fa||''});
    job.busy=false;
    if(j.scenario_complete){
      job.done=true;
      const d=prog.done['job-'+job.scenario.id]=prog.done['job-'+job.scenario.id]||{};
      d.done=true;d.count=job.count;award(job.count*2);
      if(prog.program && prog.program.lastFrom==='program'){
        if(!prog.program) prog.program={};
        prog.program[taskKey('sc',job.scenario.id)]=Date.now();
      }
      saveProg();
    }else{award(2)}
    drawJobChat();
    if(settings.autoplay&&j.reply)speak(j.reply,()=>{
      if(settings.hands&&view==='job'&&!job.busy&&!job.done&&!listening)toggleJobMic();
    });
  }catch(e){
    job.busy=false;ut.pending=false;ut.err=true;
    drawJobChat();toast(errText(e),6000);
  }
}
function saveJobMistakes(analysis){
  if(!analysis)return;
  (analysis.mistakes||[]).forEach(m=>{
    if(!m.original||!m.fix)return;
    if(mistakes.some(x=>x.original===m.original&&x.fix===m.fix))return;
    mistakes.unshift({original:m.original,fix:m.fix,explain:m.explain_fa||'',type:m.type||'',level:'job',topic:job.scenario?job.scenario.title:'',date:new Date().toLocaleDateString('fa-IR')});
  });
  mistakes=mistakes.slice(0,300);store.set('zy_mistakes',mistakes);
  schedulePushToCloud();
}
function toggleJobMic(){
  if(view!=='job'||job.busy||job.done)return;
  const b=$('#mic');
  if(listening){rec&&rec.stop();return}
  rec=listen({interim:t=>{const m=$('#msg');if(m)m.value=t},done:(t,c)=>{listening=false;const bb=$('#mic');bb&&bb.classList.remove('rec');if(t)sendJob(t,c,true)}});
  if(rec){listening=true;b&&b.classList.add('rec')}
}

/* ============ TALK ============ */
function talkSystem(){
  const style={A1:'Simple words, present simple, 1-2 sentences.',A2:'Simple clear sentences, 2-3 sentences.',
    B1:'Natural but clear, 2-3 sentences.',B2:'Natural with idioms, 2-4 sentences.',
    C1:'Sophisticated, nuanced, 2-4 sentences.',C2:'Native-level professional.'}[talk.level];
  return `You are "Sam", English tutor for a Persian speaker at CEFR ${talk.level}.
Topic: ${talk.topic}.${talk.focus?' Target: '+talk.focus:''}
Reply: ${style} React then ask exactly ONE question.
Analyse the learner's LAST message. All explanations in Persian. Max 2 mistakes A1-A2, 4 otherwise.
If message is "[START]", greet and ask first question.
Return ONLY valid JSON: {"reply":string,"reply_fa":string,"corrected":string,"is_correct":boolean,"mistakes":[{"type":string,"original":string,"fix":string,"explain_fa":string}],"better_version":string,"scores":{"grammar":0-10,"vocabulary":0-10,"fluency":0-10}|null,"new_words":[{"en":string,"fa":string}],"tip_fa":string}`;
}
function startTalk(o){
  talk={started:true,level:o.level,topic:o.topic,focus:o.focus||'',unitId:o.unitId||null,history:[],turns:[],busy:false,count:0,report:null,reporting:false};
  go('talk');aiTurn('[START]',null);
}
async function aiTurn(content,ut){
  talk.busy=true;drawChat();
  try{
    const raw=await callAI(talkSystem(),[...talk.history,{role:'user',content}],1400);
    let j;try{j=parseJSON(raw)}catch(e){j={reply:raw,reply_fa:'',mistakes:[],is_correct:true}}
    talk.history.push({role:'user',content},{role:'assistant',content:raw});
    talk.history=talk.history.slice(-16);
    if(ut){ut.pending=false;ut.an=j;saveMistakes(j,ut);award(j.is_correct&&!(j.mistakes||[]).length?4:2)}
    talk.turns.push({role:'ai',text:j.reply||'…',fa:j.reply_fa||''});
    talk.busy=false;drawChat();
    if(settings.autoplay)speak(j.reply,()=>{if(settings.hands&&view==='talk'&&!talk.busy&&!talk.report&&!listening)toggleMic()});
  }catch(e){talk.busy=false;if(ut){ut.pending=false;ut.err=true}drawChat();toast(errText(e),6000)}
}
function saveMistakes(j,ut){
  (j.mistakes||[]).forEach(m=>{
    if(!m.original||!m.fix)return;
    if(mistakes.some(x=>x.original===m.original&&x.fix===m.fix))return;
    mistakes.unshift({original:m.original,fix:m.fix,explain:m.explain_fa||'',type:m.type||'',level:talk.level,topic:talk.topic,date:new Date().toLocaleDateString('fa-IR')});
  });
  mistakes=mistakes.slice(0,300);store.set('zy_mistakes',mistakes);
  schedulePushToCloud();
}
function renderTalk(){
  const el=$('#main');
  if(!talk.started){
    let topic='Introduce yourself';
    const TOPICS=['Introduce yourself','Ordering at a café','My daily routine','Travel plans','My job','Movies and music','Technology in my life','A job interview','Health and lifestyle','Money and shopping'];
    el.innerHTML=`<div class="tstart"><h1>مکالمه‌ی آزاد</h1><p class="sub">موضوع و سطح را انتخاب کن.</p>
    <div class="card stack"><div class="field"><label>سطح</label><select id="fl">${LEVELS.map(l=>`<option value="${l.id}">${l.id} — ${l.name}</option>`).join('')}</select></div>
    <div class="field"><label>موضوع</label><div class="chips" id="chips">${TOPICS.map((t,i)=>`<button class="chip" data-t="${esc(t)}" aria-pressed="${i===0}">${esc(t)}</button>`).join('')}</div><input type="text" id="ft" dir="ltr" placeholder="یا موضوع دلخواه…"></div>
    <div class="row"><button class="btn brand" id="go">${ic('mic')} شروع</button></div></div></div>`;
    $$('.chip').forEach(c=>c.onclick=()=>{$$('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));c.setAttribute('aria-pressed','true');topic=c.dataset.t;$('#ft').value=''});
    $('#go').onclick=()=>{const cust=$('#ft').value.trim();startTalk({level:$('#fl').value,topic:cust||topic})};
    return;
  }
  el.innerHTML=`<div class="thead"><div><b class="en" dir="ltr">${esc(talk.topic)}</b><div class="sub">سطح ${talk.level}</div></div>
    <div class="row"><button class="btn ghost" id="newT">جدید</button><button class="btn brand" id="endT">پایان و گزارش</button></div></div>
    <div class="chat" id="chat"></div>
    <div id="report"></div>
    <div class="composer"><div class="hint">انگلیسی صحبت کن.</div>
      <div class="cbox"><button class="mic ${listening?'rec':''}" id="mic">${ic('mic')}</button><input type="text" id="msg" dir="ltr" placeholder="Say or type…"><button class="send" id="sendB">${ic('send')}</button></div></div>`;
  $('#newT').onclick=()=>{if('speechSynthesis' in window)speechSynthesis.cancel();rec&&rec.stop();talk.started=false;renderTalk()};
  $('#endT').onclick=endTalk;
  $('#mic').onclick=toggleMic;
  $('#sendB').onclick=()=>send($('#msg').value,null,false);
  $('#msg').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send($('#msg').value,null,false)}};
  drawChat();
  if(talk.report)drawReport();
}
function bubbleHTML(t){
  if(t.role==='ai')return `<div class="b ai"><div class="bt" dir="ltr">${esc(t.text)}</div>${settings.showFa&&t.fa?`<div class="fa">${esc(t.fa)}</div>`:''}<button class="mini" data-say="${esc(t.text)}">${ic('vol')}</button></div>`;
  return `<div class="b me"><div class="bt" dir="ltr">${esc(t.text)}</div></div>${t.err?'<div class="an">ارسال نشد.</div>':analysisHTML(t)}`;
}
function analysisHTML(t){
  if(t.pending)return `<div class="an"><span class="dots"><i></i><i></i><i></i></span> در حال تحلیل…</div>`;
  const a=t.an;if(!a)return '';
  const ms=a.mistakes||[];
  let h=`<div class="an"><div class="an-top">${a.is_correct&&!ms.length?'<span class="pill ok">درست بود</span>':'<span class="pill warn">قابل بهتر شدن</span>'}`;
  if(a.scores)h+=[['grammar','گرامر'],['vocabulary','لغت'],['fluency','روانی']].map(([k,n])=>`<span class="sc">${n} <b>${a.scores[k]??'–'}</b></span>`).join('');
  h+=`</div>`;
  if(a.corrected&&a.corrected.trim()&&norm(a.corrected)!==norm(t.text))h+=`<div class="fix"><span>✓</span><span dir="ltr">${esc(a.corrected)}</span></div>`;
  h+=ms.map(m=>`<div class="mk"><div dir="ltr"><s>${esc(m.original)}</s> → <b>${esc(m.fix)}</b></div><div>${esc(m.explain_fa||'')}</div></div>`).join('');
  if((a.new_words||[]).length)h+=`<div class="nw">`+a.new_words.map(w=>`<span dir="ltr">${esc(w.en)} · ${esc(w.fa)}</span>`).join('')+`</div>`;
  if(a.tip_fa)h+=`<div class="tip">${esc(a.tip_fa)}</div>`;
  return h+`</div>`;
}
function drawChat(){
  const c=$('#chat');if(!c||view!=='talk')return;
  c.innerHTML=talk.turns.map(bubbleHTML).join('')+(talk.busy&&!talk.turns.some(t=>t.pending)?`<div class="b ai"><span class="dots"><i></i><i></i><i></i></span></div>`:'');
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
async function send(text,conf,voice){
  text=(text||'').trim();if(!text||talk.busy)return;
  const m=$('#msg');if(m)m.value='';
  const ut={role:'me',text,pending:true};talk.turns.push(ut);talk.count++;
  const content=voice&&conf!=null?`${text}\n[speech_confidence: ${Number(conf).toFixed(2)}]`:text;
  await aiTurn(content,ut);
}
function toggleMic(){
  if(view!=='talk'||talk.busy)return;
  const b=$('#mic');
  if(listening){rec&&rec.stop();return}
  rec=listen({interim:t=>{const m=$('#msg');if(m)m.value=t},done:(t,c)=>{listening=false;const bb=$('#mic');bb&&bb.classList.remove('rec');if(t)send(t,c,true)}});
  if(rec){listening=true;b&&b.classList.add('rec')}
}
async function endTalk(){
  if(talk.count<1){toast('اول چند جمله صحبت کن.');return}
  if(talk.reporting)return;
  if('speechSynthesis' in window)speechSynthesis.cancel();rec&&rec.stop();
  talk.reporting=true;$('#report').innerHTML=`<div class="card"><b>در حال تهیه‌ی گزارش…</b><div class="skel"></div></div>`;
  const tr=talk.turns.map(t=>t.role==='ai'?'Tutor: '+t.text:'Learner: '+t.text).join('\n');
  try{
    const raw=await callAI(`Write a session report for a Persian learner (level ${talk.level}). Return ONLY JSON: {"summary_fa":string,"level_estimate":string,"strengths_fa":[string],"weak_points_fa":[string],"next_steps_fa":[string],"vocab_to_review":[{"en":string,"fa":string}]}.`, [{role:'user',content:tr}],1200);
    talk.report=parseJSON(raw);award(20);
    if(talk.unitId){const d=prog.done[talk.unitId]=prog.done[talk.unitId]||{};d.talk=true;saveProg()}
    talk.reporting=false;drawReport();
  }catch(e){talk.reporting=false;$('#report').innerHTML='';toast(errText(e),6000)}
}
function drawReport(){
  const r=talk.report,el=$('#report');if(!r||!el)return;
  const li=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  el.innerHTML=`<div class="card report"><h2>گزارش جلسه</h2><p>${esc(r.summary_fa)}</p><p><b>سطح:</b> <span dir="ltr">${esc(r.level_estimate)}</span></p>
    <h2>نقاط قوت</h2><ul>${li(r.strengths_fa)}</ul><h2>نقاط ضعف</h2><ul>${li(r.weak_points_fa)}</ul><h2>قدم‌های بعدی</h2><ul>${li(r.next_steps_fa)}</ul>
    <div class="row" style="margin-top:16px"><button class="btn brand" id="rNew">گفتگوی جدید</button></div></div>`;
  $('#rNew').onclick=()=>{talk.started=false;renderTalk()};
  el.scrollIntoView({behavior:'smooth'});
}

/* ============ NOTEBOOK ============ */
function renderNotes(){
  let h=`<div class="row between"><div><h1>دفترچه اشتباهات</h1><p class="sub">همه‌ی اشتباهات.</p></div>
  <div class="row"><button class="btn brand" id="drill" ${mistakes.length?'':'disabled'}>تمرین</button><button class="btn ghost" id="clr" ${mistakes.length?'':'disabled'}>پاک کردن</button></div></div>
  <div id="drillBox" style="margin-top:16px"></div><div class="nb" style="margin-top:16px">`;
  h+=mistakes.length?mistakes.map(m=>`<div class="nbi"><div class="row between"><span dir="ltr"><s style="color:var(--bad)">${esc(m.original)}</s> → <b style="color:var(--ok)">${esc(m.fix)}</b></span><button class="mini" data-say="${esc(m.fix)}">${ic('vol')}</button></div><div>${esc(m.explain)}</div><div class="sub" style="font-size:.8rem">${esc(m.type)} · ${esc(m.level)} ${m.topic?'· '+esc(m.topic):''} · ${esc(m.date)}</div></div>`).join(''):`<div class="card">هنوز اشتباهی ثبت نشده.</div>`;
  $('#main').innerHTML=h+'</div>';
  const c=$('#clr');if(c)c.onclick=()=>{if(confirm('پاک شود؟')){mistakes=[];store.set('zy_mistakes',mistakes);schedulePushToCloud();renderNotes()}};
  const d=$('#drill');if(d)d.onclick=async()=>{
    const box=$('#drillBox');box.innerHTML=`<div class="card"><b>در حال ساخت تمرین…</b><div class="skel"></div></div>`;
    try{
      const src=mistakes.slice(0,15).map(m=>`wrong: ${m.original} | right: ${m.fix}`).join('\n');
      const raw=await callAI(`Create 6 MC exercises practising these mistakes. Return ONLY JSON: {"quiz":[{"q":string,"options":[string,string,string,string],"answer":number,"why_fa":string}]}.`, [{role:'user',content:src}],2500);
      const j=parseJSON(raw);
      box.innerHTML=`<div class="card"><h2>تمرین شخصی‌سازی‌شده</h2><div id="dq">${quizHTML(j.quiz)}</div></div>`;
      bindQuiz($('#dq'),j.quiz,(s,n)=>{award(s*2);$('.qres',$('#dq')).textContent=`نتیجه: ${fa(s)} از ${fa(n)}`});
    }catch(e){box.innerHTML='';toast(errText(e),6000)}
  };
}

/* ============ SETTINGS ============ */
function renderSettings(){
  loadVoices();
  const syncActive=syncEnabled;
  $('#main').innerHTML=`<h1>تنظیمات</h1>
  <div class="card stack" style="margin-top:14px">
    <h3>هوش مصنوعی</h3>
    <div class="field"><label for="k">کلید API (1xai.ir)</label><input type="password" id="k" dir="ltr" placeholder="1xai-..." value="${esc(settings.key)}"></div>
    <div class="field"><label for="p">آدرس پروکسی</label><input type="text" id="p" dir="ltr" placeholder="https://cors-1xai.zarin-farm1.workers.dev" value="${esc(settings.proxy||'')}"></div>
    <div class="field"><label for="m">مدل</label><select id="m">
      <option value="gpt-4o-mini">gpt-4o-mini (پیشنهادی)</option>
      <option value="gpt-4.1-mini">gpt-4.1-mini</option>
      <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
      <option value="deepseek-chat">deepseek-chat</option>
      <option value="claude-3-5-haiku">claude-3-5-haiku</option>
      <option value="claude-sonnet-4-6">claude-sonnet-4-6</option>
      <option value="gemini-2.0-flash-lite">gemini-2.0-flash-lite</option>
      <option value="gemini-2.5-flash">gemini-2.5-flash</option>
    </select></div>
    <div class="field"><label for="r">سرعت صدا</label><select id="r"><option value="slow">آهسته</option><option value="normal">عادی</option><option value="fast">سریع</option></select></div>
    <div class="field"><label for="v">صدای معلم</label><select id="v"><option value="">پیش‌فرض</option>${voices.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></div>
    <div class="row"><button class="btn brand" id="sv">ذخیره</button><button class="btn ghost" id="ts">آزمایش</button></div>
  </div>
  <div class="card stack" style="margin-top:16px">
    <h3>☁️ همگام‌سازی</h3>
    <div class="field"><label for="sc">کد همگام‌سازی</label><input type="password" id="sc" dir="ltr" placeholder="حداقل ۸ کاراکتر" value="${esc(settings.syncCode||'')}"></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer"><input type="checkbox" id="sa" ${settings.syncAuto?'checked':''} style="width:16px;height:16px"> ذخیره‌ی خودکار در ابر</label>
    <div class="row">
      <button class="btn brand" id="scActivate">${syncActive?'به‌روزرسانی':'فعال‌سازی'}</button>
      <button class="btn ghost" id="scPull">دریافت</button>
      <button class="btn ghost" id="scPush">ارسال</button>
    </div>
    <div class="sync-status"><span class="sync-dot ${syncActive?'on':'off'}"></span>${syncActive?'فعال':'غیرفعال'}</div>
  </div>
  <div class="card stack" style="margin-top:16px">
    <h3>📤 صادرات / واردات</h3>
    <div class="row"><button class="btn brand" id="exBtn">صادرات</button><button class="btn ghost" id="imBtn">واردات</button></div>
    <div id="exBox" style="display:none"><textarea id="exText" readonly></textarea><button class="btn ghost" id="exCopy" style="margin-top:8px">کپی</button></div>
    <div id="imBox" style="display:none"><textarea id="imText" placeholder="کد را پیست کن..."></textarea><button class="btn brand" id="imGo" style="margin-top:8px">وارد کردن</button></div>
  </div>
  <div class="card stack" style="margin-top:16px">
    <h3>🗑 پاک کردن داده‌ها</h3>
    <button class="btn ghost" id="rs">پاک کردن پیشرفت</button>
  </div>`;

  $('#m').value=settings.model;$('#r').value=settings.rate;$('#v').value=settings.voice;
  const save=()=>{
    settings.key=$('#k').value.trim();settings.model=$('#m').value;settings.rate=$('#r').value;
    settings.voice=$('#v').value;settings.proxy=$('#p').value.trim();
    settings.syncCode=$('#sc').value.trim();settings.syncAuto=$('#sa').checked;
    store.set('zy_settings',settings);
  };
  $('#sv').onclick=()=>{save();toast('ذخیره شد.')};
  $('#ts').onclick=async()=>{save();try{await callAI('Reply with: ok',[{role:'user',content:'ping'}],20);toast('اتصال موفق ✅')}catch(e){toast(errText(e),6000)}};
  const sca=$('#scActivate');
  if(sca)sca.onclick=async()=>{
    save();
    if(!settings.proxy||!settings.syncCode||settings.syncCode.length<8){toast('پروکسی و کد حداقل ۸ کاراکتر.');return}
    syncEnabled=false;
    if(await initSync()){
      toast('بارگذاری...');
      await pullFromCloud(true);
      toast('فعال شد ✅');renderSettings();
    }
  };
  const scp=$('#scPull');if(scp)scp.onclick=async()=>{save();if(!syncEnabled&&!await initSync())return;await pullFromCloud();renderSettings()};
  const scpush=$('#scPush');if(scpush)scpush.onclick=async()=>{save();if(!syncEnabled&&!await initSync())return;await pushToCloud();toast('ارسال ✅')};
  const sa=$('#sa');if(sa)sa.onchange=()=>{settings.syncAuto=sa.checked;store.set('zy_settings',settings)};
  $('#exBtn').onclick=()=>{try{$('#exText').value=exportData();$('#exBox').style.display='block';$('#imBox').style.display='none'}catch(e){toast('خطا')}};
  $('#imBtn').onclick=()=>{$('#imBox').style.display='block';$('#exBox').style.display='none'};
  const ec=$('#exCopy');if(ec)ec.onclick=async()=>{const t=$('#exText');t.select();try{await navigator.clipboard.writeText(t.value);toast('کپی شد ✅')}catch(e){document.execCommand('copy');toast('کپی شد ✅')}};
  const ig=$('#imGo');if(ig)ig.onclick=()=>{
    try{
      const b64=$('#imText').value.trim();
      if(!b64){toast('خالی است');return}
      if(!confirm('پیشرفت فعلی جایگزین شود؟'))return;
      importData(b64);schedulePushToCloud();toast('وارد شد ✅');updateStats();go('program');
    }catch(e){toast('کد نامعتبر',5000)}
  };
  $('#rs').onclick=()=>{if(confirm('پاک شود؟')){prog={xp:0,streak:0,last:'',done:{},program:{}};lessonCache={};store.set('zy_lessons',{});saveProg();toast('پاک شد.')}};
  updateSyncUI();
}

/* ============ init ============ */
updateStats();
go('program');
if(settings.proxy&&settings.syncCode){
  (async()=>{if(await initSync())await pullFromCloud(true)})();
}
</script>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>زبان‌یار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9f1f1; --card:#fff; --ink:#14213d; --muted:#5b6b80; --line:#cddada;
  --brand:#0e9a9a; --brand-soft:#d5efef; --brand-ink:#fff;
  --accent:#f2b134; --accent-soft:#fdf0d0;
  --ok:#23906a; --ok-soft:#d8f1e6; --bad:#d64550; --bad-soft:#fbe0e2;
  --job:#6c4ad6; --job-soft:#eae4fb;
  --prog:#c2410c; --prog-soft:#ffedd5;
  --r-lg:22px; --r-md:14px; --r-sm:9px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1524; --card:#142038; --ink:#eaf0f7; --muted:#93a3ba; --line:#243554;
  --brand:#2bc0bf; --brand-soft:#123a45; --brand-ink:#06222a;
  --accent:#f5be55; --accent-soft:#3a2f14;
  --ok:#4cc494; --ok-soft:#12352b; --bad:#f2808a; --bad-soft:#3a1a22;
  --job:#a48cf0; --job-soft:#2a2352;
  --prog:#fb923c; --prog-soft:#3a2414;
}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;min-height:100vh}
.en,[dir=ltr]{font-family:'Lexend','Vazirmatn',sans-serif;line-height:1.6}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem}
.logo i{display:grid;place-items:center;width:38px;height:38px;border-radius:12px 12px 12px 4px;background:linear-gradient(135deg,var(--brand),#1b4f9c);color:#fff;font:600 1rem 'Lexend',sans-serif;font-style:normal}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.85rem;font-weight:500}
.stat b{color:var(--brand)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-current=true]{background:var(--ink);color:var(--bg)}
main{padding:22px 0 60px}
h1{font-size:1.6rem;font-weight:800;line-height:1.4}
h2{font-size:1.15rem;font-weight:700;margin-bottom:10px}
h3{font-size:1rem;font-weight:700;margin-bottom:8px;color:var(--brand)}
.sub{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.stack>*+*{margin-top:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700}
.btn.brand{background:var(--brand);color:var(--brand-ink)}
.btn.job{background:var(--job);color:#fff}
.btn.prog{background:var(--prog);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{color:var(--brand);font-weight:600;padding:4px 0}
.mini{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);flex:none}
.mini.rec{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
.pill{display:inline-block;padding:1px 12px;border-radius:999px;font-size:.82rem;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--accent-soft);color:#a86d00}
.pill.job{background:var(--job-soft);color:var(--job)}
.pill.prog{background:var(--prog-soft);color:var(--prog)}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:var(--r-md);background:var(--accent-soft);border:1px solid var(--accent);margin-bottom:18px}
.week-nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.week-tab{min-width:80px;padding:8px 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);text-align:center;flex:none;transition:all .15s;cursor:pointer}
.week-tab b{display:block;font-size:1.1rem;font-family:'Lexend',sans-serif}
.week-tab small{font-size:.72rem;color:var(--muted)}
.week-tab[aria-pressed=true]{background:var(--prog);border-color:var(--prog);color:#fff}
.week-tab[aria-pressed=true] small{color:rgba(255,255,255,.85)}
.week-tab.done{background:var(--ok-soft);border-color:var(--ok)}
.week-tab.done[aria-pressed=true]{background:var(--prog);border-color:var(--prog);color:#fff}
.week-head{padding:16px 18px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--prog),#a83a00);color:#fff;margin-bottom:16px}
.week-head h2{color:#fff;margin:0 0 4px;font-size:1.2rem}
.week-head p{margin:0;font-size:.9rem;opacity:.9}
.week-head .prog-bar{margin-top:12px;height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.week-head .prog-bar i{display:block;height:100%;background:#fff;transition:width .3s}
.week-section{margin-top:16px}
.week-section h3{color:var(--prog);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.task-list{display:flex;flex-direction:column;gap:8px}
.task{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);text-align:start;cursor:pointer;transition:all .15s;width:100%;font:inherit;color:inherit}
.task:hover{border-color:var(--prog);transform:translateX(-2px)}
.task.done{background:var(--ok-soft);border-color:var(--ok)}
.task .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:.85rem;color:transparent;font-weight:700}
.task.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.task .body{flex:1;min-width:0;text-align:start}
.task .tt{font-weight:600;font-size:.95rem;word-break:break-word}
.task .td{font-size:.82rem;color:var(--muted);margin-top:2px;word-break:break-word}
.task .badge{font-size:.7rem;padding:2px 8px;border-radius:8px;background:var(--prog-soft);color:var(--prog);font-weight:600;flex:none}
.task .badge.lv{background:var(--brand-soft);color:var(--brand)}
.task .badge.jb{background:var(--job-soft);color:var(--job)}
.schedule{padding:14px 16px;background:var(--prog-soft);border-radius:var(--r-md);margin-top:8px}
.schedule ul{margin:6px 0 0 18px;padding:0}
.schedule li{margin-bottom:4px;font-size:.9rem}
.levels{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:14px 0 18px}
.lv{min-width:104px;padding:10px 14px;border-radius:var(--r-md);background:var(--card);border:1.5px solid var(--line);text-align:center;cursor:pointer}
.lv b{display:block;font:600 1.15rem 'Lexend',sans-serif}
.lv small{color:var(--muted)}
.lv[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.unit{display:flex;gap:14px;align-items:center;text-align:start;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);cursor:pointer;font:inherit;color:inherit;width:100%;transition:border-color .15s}
.unit:hover{border-color:var(--brand)}
.unit .n{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);font:600 1rem 'Lexend',sans-serif;flex:none}
.unit.done .n{background:var(--ok);color:#fff}
.unit .t{font:500 1rem 'Lexend',sans-serif;line-height:1.4}
.unit .f{font-size:.85rem;color:var(--muted)}
.unit .st{margin-inline-start:auto;font-size:.75rem;color:var(--muted);text-align:end}
.lh{margin:10px 0 18px}
.lvl{display:inline-block;padding:0 12px;border-radius:8px;background:var(--accent);color:#3b2a00;font:600 .9rem 'Lexend',sans-serif;margin-bottom:8px}
.steps{display:flex;gap:8px;margin-bottom:18px}
.stp{flex:1;padding:10px;border-radius:var(--r-md);background:var(--card);border:1.5px solid var(--line);font-weight:600;text-align:center;color:var(--muted);cursor:pointer;font:inherit}
.stp[aria-current=true]{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.vc{padding:14px 16px;border-radius:var(--r-md);background:var(--bg);border:1px solid var(--line)}
.vc .w{font:600 1.2rem 'Lexend',sans-serif}
.vc .say{color:var(--brand);font-size:.9rem}
.vc .ex{margin-top:6px;font-size:.92rem}
.vc .exfa{color:var(--muted);font-size:.85rem}
.pr{font-size:.85rem;min-height:1.4em}
.pr.ok{color:var(--ok)} .pr.no{color:var(--bad)}
.rules li{margin-inline-start:20px;margin-bottom:6px}
.rules li span{font-family:'Lexend',sans-serif}
.pre{white-space:pre-line}
.dl{display:flex;flex-direction:column;gap:8px}
.dline{display:flex;gap:10px;align-items:flex-start;max-width:88%}
.dline.b{align-self:flex-end;flex-direction:row-reverse}
.dline .bub{padding:8px 14px;border-radius:16px;background:var(--brand-soft)}
.dline.b .bub{background:var(--accent-soft)}
.dline .fa{font-size:.85rem;color:var(--muted)}
.ex-item{padding:8px 0;border-bottom:1px dashed var(--line)}
.ex-item:last-child{border:0}
.q{padding:14px 0;border-bottom:1px solid var(--line)}
.q:last-of-type{border:0}
.qt{font-weight:600;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{padding:10px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);text-align:start;background:var(--card);cursor:pointer;font:inherit;color:inherit}
.opt:hover{border-color:var(--brand)}
.q.done .opt{cursor:default}
.opt.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.why{font-size:.9rem;color:var(--muted);margin-top:8px}
.qres{margin-top:12px;font-weight:700}
.tstart{display:grid;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-family:'Lexend','Vazirmatn',sans-serif;font-size:.9rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:.92rem}
input[type=text],input[type=password],input[type=email],select,textarea{width:100%;padding:10px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:80px;resize:vertical;font-family:monospace;font-size:.85rem;line-height:1.5}
.thead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:18px}
.b{max-width:88%;padding:10px 16px;border-radius:20px;position:relative}
.b.ai{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-end-end-radius:6px}
.b.me{align-self:flex-start;background:var(--brand);color:var(--brand-ink);border-end-start-radius:6px}
.b.job-ai{align-self:flex-start;background:var(--job-soft);border:1px solid var(--job);border-end-start-radius:6px;color:var(--ink)}
.b.job-me{align-self:flex-end;background:var(--job);color:#fff;border-end-end-radius:6px}
.b .bt{font-size:1.05rem}
.b .fa{font-size:.85rem;color:var(--muted);margin-top:2px}
.b.job-ai .fa{color:#7a6ba8}
.b .mini{margin-top:6px}
.an{align-self:flex-start;width:min(100%,600px);padding:12px 16px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--accent);font-size:.92rem}
.an-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.sc{display:inline-flex;gap:6px;align-items:center;padding:0 10px;border-radius:8px;background:var(--bg);font-size:.8rem}
.fix{display:flex;gap:8px;align-items:center;color:var(--ok);font-weight:500;margin:6px 0}
.mk{margin:8px 0;padding:8px 12px;border-radius:var(--r-sm);background:var(--bad-soft)}
.mk s{color:var(--bad)} .mk b{color:var(--ok)}
.mk .ty{font-size:.75rem;color:var(--muted)}
.tip{margin-top:8px;color:var(--muted)}
.nw{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nw span{padding:0 10px;border-radius:8px;background:var(--accent-soft);font-size:.85rem}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.composer{position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 24%)}
.cbox{display:flex;gap:10px;align-items:center;padding:8px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 6px 24px rgba(20,33,61,.12)}
.cbox input{border:0;background:transparent;padding:8px 12px}
.mic{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--brand);color:var(--brand-ink);flex:none;cursor:pointer}
.mic.job-mic{background:var(--job)}
.mic .ic{width:26px;height:26px}
.mic.rec{background:var(--bad);color:#fff;animation:ring 1.4s infinite}
.send{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);flex:none;cursor:pointer}
.hint{text-align:center;color:var(--muted);font-size:.82rem;margin-bottom:8px}
.toggles{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.nb{display:grid;gap:10px}
.nbi{padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md)}
.sync-status{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r-sm);background:var(--bg);border:1px solid var(--line);font-size:.9rem}
.sync-dot{width:10px;height:10px;border-radius:50%;flex:none}
.sync-dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.sync-dot.off{background:var(--muted)}
.sync-dot.pending{background:var(--accent);animation:pulse 1.2s infinite}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%;animation:sh 1.3s infinite;margin:10px 0}
.toast{position:fixed;inset-inline:16px;bottom:96px;max-width:440px;margin:auto;padding:12px 18px;border-radius:var(--r-md);background:var(--ink);color:var(--bg);z-index:60;font-size:.92rem;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.err-overlay{position:fixed;inset:0;background:rgba(214,69,80,.95);color:#fff;z-index:100;padding:30px;display:grid;place-content:center;text-align:center;font-family:monospace;direction:ltr}
.err-overlay pre{background:rgba(0,0,0,.3);padding:16px;border-radius:8px;margin-top:16px;text-align:left;overflow:auto;max-height:50vh;font-size:12px}
@keyframes pulse{50%{opacity:.7}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></symbol>

<symbol id="i-note" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></symbol>

<symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></symbol>

<symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
<symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
</defs></svg>

<header class="top"><div class="wrap">
  <div class="bar">
    <div class="logo"><i>Aa</i><span>زبان‌یار</span></div>
    <div class="stats">
      <div class="stat">امتیاز <b id="xp">۰</b></div>
      <div class="stat">روز <b id="streak">۰</b></div>
      <div class="stat" id="syncBadge" style="display:none"><span class="sync-dot off" id="syncDot"></span><b id="syncLabel">آفلاین</b></div>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab" data-v="program" type="button"><svg class="ic"><use href="#i-cal"/></svg>برنامه من</button>
    <button class="tab" data-v="path" type="button"><svg class="ic"><use href="#i-book"/></svg>درس‌ها</button>

// ============ HELPERS ============
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fa(n){return Number(n||0).toLocaleString('fa-IR')}
function ic(id){return '<svg class="ic"><use href="#i-'+id+'"/></svg>'}
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
function toast(msg,ms){
  ms = ms || 3800;
  var t = document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(function(){t.remove()},ms);
}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z' ]/g,'').replace(/\s+/g,' ').trim()}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i];for(j=1;j<=n;j++)d[i][j]=0}for(j=1;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function sim(a,b){return 1-lev(a,b)/Math.max(a.length,b.length,1)}

  program: (savedProg.program && typeof savedProg.program === 'object' && !Array.isArray(savedProg.program)) ? savedProg.program : {}

function saveProg(){
  if(!prog.program || typeof prog.program !== 'object') prog.program = {};
  store.set('zy_prog', prog);
  updateStats();
  schedulePushToCloud();
}
function updateStats(){
  var xpEl = $('#xp'); if(xpEl) xpEl.textContent = fa(prog.xp);
  var stEl = $('#streak'); if(stEl) stEl.textContent = fa(prog.streak);
}
function award(n){
  prog.xp = (Number(prog.xp)||0) + n;
  var today = new Date().toDateString();
  var y = new Date(Date.now()-864e5).toDateString();
  if(prog.last !== today){

    prog.last = today;
  }
  saveProg();
}

// ============ CLOUDFLARE SYNC ============
var syncKey=null, syncTimer=null, syncEnabled=false;
function updateSyncUI(){
  var badge=$('#syncBadge'); if(!badge) return;
  if(!settings.proxy || !settings.syncCode){badge.style.display='none';return}
  badge.style.display='flex';
  var dot=$('#syncDot'), label=$('#syncLabel');
  if(!dot||!label) return;
  dot.className='sync-dot '+(syncEnabled?'on':'off');
  label.textContent = syncEnabled?'متصل':'آفلاین';
}
function computeSyncKey(code){
  if(window.crypto && window.crypto.subtle){
    var data = new TextEncoder().encode('zabanyar-v1:'+code);
    return window.crypto.subtle.digest('SHA-256', data).then(function(hash){
      return Array.from(new Uint8Array(hash)).map(function(b){return b.toString(16).padStart(2,'0')}).join('').slice(0,32);
    });
  } else {
    // fallback ساده
    var h=0, str='zabanyar-v1:'+code;
    for(var i=0;i<str.length;i++){h=((h<<5)-h+str.charCodeAt(i))|0}
    return Promise.resolve(Math.abs(h).toString(16).padStart(32,'0'));
  }
}
function initSync(){
  if(!settings.proxy || !settings.syncCode) return Promise.resolve(false);
  return computeSyncKey(settings.syncCode).then(function(k){
    syncKey=k; syncEnabled=true; updateSyncUI(); return true;
  }).catch(function(e){console.error('Sync init error:',e);return false});
}
function pushToCloud(){
  if(!syncEnabled || !syncKey) return Promise.resolve();
  var base = settings.proxy.replace(/\/+$/,'');
  var payload = {prog:prog, lessonCache:lessonCache, mistakes:mistakes, updatedAt:Date.now()};
  return fetch(base+'/sync/'+syncKey, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      var dot=$('#syncDot'); if(dot) dot.className='sync-dot on';
    })
    .catch(function(e){console.error('Push error:',e);toast('خطا در ذخیره: '+e.message,5000)});
}
function pullFromCloud(silent){
  if(!syncEnabled || !syncKey) return Promise.resolve(false);
  var base = settings.proxy.replace(/\/+$/,'');
  return fetch(base+'/sync/'+syncKey).then(function(r){
    if(r.status===404){ return pushToCloud().then(function(){if(!silent)toast('پیشرفت محلی به ابر فرستاده شد ✅');return true}) }
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json().then(function(d){
      if(d.prog){
        prog = Object.assign({xp:0,streak:0,last:'',done:{},program:{}}, d.prog);
        if(!prog.program || typeof prog.program !== 'object') prog.program={};
        if(!prog.done || typeof prog.done !== 'object') prog.done={};
        store.set('zy_prog', prog); updateStats();
      }
      if(d.lessonCache && typeof d.lessonCache === 'object'){lessonCache=d.lessonCache; store.set('zy_lessons',lessonCache)}
      if(Array.isArray(d.mistakes)){mistakes=d.mistakes; store.set('zy_mistakes',mistakes)}
      if(!silent) toast('پیشرفت از ابر بارگذاری شد ✅');
      render(); return true;
    });
  }).catch(function(e){console.error('Pull error:',e);if(!silent)toast('خطا: '+e.message,5000);return false});
}
function schedulePushToCloud(){
  if(!syncEnabled || !settings.syncAuto) return;
  clearTimeout(syncTimer);
  var dot=$('#syncDot'); if(dot) dot.className='sync-dot pending';
  syncTimer = setTimeout(pushToCloud, 1500);
}
function exportData(){
  var data={v:1,exportedAt:new Date().toISOString(),prog:prog,lessonCache:lessonCache,mistakes:mistakes};
  return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}
function importData(b64){
  var json = decodeURIComponent(escape(atob(b64.trim())));
  var data = JSON.parse(json);
  if(data.prog){prog=Object.assign({xp:0,streak:0,last:'',done:{},program:{}},data.prog);if(!prog.program)prog.program={};store.set('zy_prog',prog);updateStats()}
  if(data.lessonCache){lessonCache=data.lessonCache;store.set('zy_lessons',lessonCache)}
  if(data.mistakes){mistakes=data.mistakes;store.set('zy_mistakes',mistakes)}
  return true;
}

// ============ 1xai API ============
function callAI(system,messages,max){
  max = max || 1500;
  if(!settings.key) return Promise.reject(new Error('NOKEY'));
  var baseUrl = (settings.proxy && settings.proxy.trim()) ? settings.proxy.trim().replace(/\/+$/,'') : 'https://1xai.ir';
  var body = {model:settings.model, max_tokens:max, messages:[{role:'system',content:system}].concat(messages)};
  return fetch(baseUrl+'/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.key},
    body:JSON.stringify(body)
  }).then(function(r){
    if(!r.ok) return r.json().catch(function(){return{}}).then(function(d){
      var m = (d.error && d.error.message) || (d.error) || '';
      throw new Error(r.status + (m?' — '+m:''));
    });
    return r.json();
  }).then(function(d){
    return ((d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content)||'').trim();
  });
}
function parseJSON(t){
  t = t.replace(/```json|```/g,'');
  var a = t.indexOf('{'), b = t.lastIndexOf('}');
  if(a<0 || b<0) throw new Error('bad json');
  return JSON.parse(t.slice(a,b+1));
}
function errText(e){
  if(e.message==='NOKEY') return 'اول کلید API را در «تنظیمات» وارد کنید.';
  if(/Failed to fetch/i.test(e.message)) return 'اتصال به سرور برقرار نشد. آدرس پروکسی را در تنظیمات وارد کنید.';
  return 'خطا: '+e.message;
}

// ============ SPEECH ============
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var voices = [];
function loadVoices(){
  if('speechSynthesis' in window){
    voices = speechSynthesis.getVoices().filter(function(v){return v.lang && v.lang.toLowerCase().indexOf('en')===0});
  }
}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged = loadVoices; loadVoices()}
function speak(text,onend,pitch){
  pitch = pitch || 1;
  if(!('speechSynthesis' in window)){onend&&onend();return}
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.pitch=pitch;
  var v = voices.filter(function(x){return x.name===settings.voice})[0] || voices.filter(function(x){return x.lang==='en-US'})[0] || voices[0];
  if(v) u.voice=v;
  u.rate = ({slow:0.72,normal:0.95,fast:1.15})[settings.rate] || 0.9;
  var fin=false;
  var end=function(){if(!fin){fin=true;onend&&onend()}};
  u.onend=end; u.onerror=end;
  speechSynthesis.speak(u);
}
function listen(opt){
  if(!SR){toast('این مرورگر تشخیص گفتار ندارد.');return null}
  if('speechSynthesis' in window) speechSynthesis.cancel();
  var r = new SR();
  r.lang='en-US'; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
  var text='', conf=null;
  r.onresult = function(e){
    var t='', c=null;
    for(var i=0;i<e.results.length;i++){t+=e.results[i][0].transcript+' ';c=e.results[i][0].confidence}
    text=t.trim(); conf=c;
    opt.interim && opt.interim(text);
  };
  r.onerror = function(e){
    if(e.error==='not-allowed') toast('دسترسی به میکروفون داده نشد.');
  };
  r.onend = function(){opt.done && opt.done(text,conf)};
  try{r.start()}catch(e){return null}
  return r;
}

function go(v){
  view = v;
  $$('.tab').forEach(function(t){
    t.setAttribute('aria-current', String(t.getAttribute('data-v') === (v==='lesson'?'path':v)));
  });
  render();
  window.scrollTo(0,0);
}
function render(){
  try{
    if(view==='program') return renderProgram();
    if(view==='path') return renderPath();
    if(view==='lesson') return renderLesson();
    if(view==='job') return renderJob();
    if(view==='talk') return renderTalk();
    if(view==='notes') return renderNotes();
    if(view==='settings') return renderSettings();

    var m = $('#main');
    if(m) m.innerHTML = '<div class="card"><b>خطا در نمایش</b><p style="margin:10px 0;font-family:monospace;font-size:12px" dir="ltr">'+esc(e.message)+'</p><button class="btn brand" onclick="location.reload()" type="button">رفرش</button></div>';

}

function taskKey(type,id){return type+':'+id}
function isTaskDone(type,id){
  if(!prog.program || typeof prog.program !== 'object') return false;
  return !!prog.program[taskKey(type,id)];
}
function toggleTask(type,id){
  if(!prog.program || typeof prog.program !== 'object') prog.program = {};
  var k = taskKey(type,id);
  if(prog.program[k]) delete prog.program[k];
  else {prog.program[k]=Date.now(); award(3)}
  saveProg();
  renderProgram();
}
function weekProgress(w){
  var p = null;
  for(var i=0;i<PROGRAM.length;i++) if(PROGRAM[i].week===w){p=PROGRAM[i];break}
  if(!p) return 0;
  var total = p.lessons.length + p.scenarios.length;
  var done = 0;
  p.lessons.forEach(function(l){if(isTaskDone('les',l.level+':'+l.idx))done++});
  p.scenarios.forEach(function(s){if(isTaskDone('sc',s.id))done++});
  return total ? Math.round(done*100/total) : 0;
}
function isWeekDone(w){return weekProgress(w)===100}

var LESSON_SYS = 'You are an expert EFL curriculum designer for Persian speakers. Create ONE lesson as strict JSON (no markdown).\nSchema: {"title":string,"intro_fa":string,"vocab":[{"en":string,"say":string,"fa":string,"ex":string,"ex_fa":string}],"grammar":{"title":string,"explain_fa":string,"rules":[string],"examples":[{"en":string,"fa":string}]},"dialogue":[{"speaker":"A"|"B","en":string,"fa":string}],"phrases":[{"en":string,"fa":string}],"quiz":[{"q":string,"options":[string,string,string,string],"answer":number,"why_fa":string}],"speaking_goal":string}\nRules: exactly 10 vocab, "say" for A1-A2, grammar in Persian, dialogue 6-8 lines, 5 phrases, 6 quiz (0-based answer), all Persian explanations, valid JSON.';

function openLesson(level,idx){
  var L = null;
  for(var i=0;i<LEVELS.length;i++) if(LEVELS[i].id===level){L=LEVELS[i];break}
  if(!L) return;
  var unit = L.units[idx];
  if(!unit) return;
  var id = unitId(level,idx);
  var cached = lessonCache[id];
  var hasLesson = (id==='A1-0') || !!cached;
  lessonCtx = {id:id, level:level, idx:idx, unit:unit, lesson:(id==='A1-0'?DEMO:(cached||null)), step:'learn', loading:!hasLesson, err:null, quizDone:false};
  go('lesson');
  if(!hasLesson) genLesson();
}
function genLesson(){
  var C = lessonCtx; if(!C) return;
  C.loading = true; C.err = null; render();
  callAI(LESSON_SYS, [{role:'user',content:'CEFR: '+C.level+'\nUnit: "'+C.unit[0]+'" ('+C.unit[1]+')\nFocus: '+C.unit[2]}], 5000)
    .then(function(raw){
      var j = parseJSON(raw);
      if(!j.vocab || !j.quiz) throw new Error('incomplete lesson');
      lessonCache[C.id] = j; store.set('zy_lessons', lessonCache); C.lesson = j;
      schedulePushToCloud();
      C.loading = false;
      if(view==='lesson' && lessonCtx===C) render();
    })
    .catch(function(e){
      C.err = errText(e);
      C.loading = false;
      if(view==='lesson' && lessonCtx===C) render();
    });
}

  var C = lessonCtx; if(!C){go('path');return}

function bindQuiz(root, quiz, done){

    });

}

  var a = t.an; if(!a) return '';
  var ms = a.mistakes||[];
  var h = '<div class="an"><div class="an-top">'+(a.is_correct&&!ms.length?'<span class="pill ok">عالی</span>':'<span class="pill warn">بهتر می‌شه</span>');

function startTalk(o){

function aiTurn(content, ut){

    .then(function(raw){
      var j; try{j=parseJSON(raw)}catch(e){j={reply:raw, reply_fa:'', mistakes:[], is_correct:true}}
      talk.history.push({role:'user',content:content},{role:'assistant',content:raw});
      talk.history = talk.history.slice(-16);
      if(ut){
        ut.pending = false; ut.an = j;
        saveMistakes(j);
        award(j.is_correct && !(j.mistakes||[]).length ? 4 : 2);
      }
      talk.turns.push({role:'ai', text:j.reply||'…', fa:j.reply_fa||''});

      if(settings.autoplay) speak(j.reply, function(){
        if(settings.hands && view==='talk' && !talk.busy && !talk.report && !listening) toggleMic();
      });

      drawChat();
      toast(errText(e), 6000);
    });

  var r = talk.report, el = $('#report'); if(!r || !el) return;
  var li = function(a){return (a||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')};
  el.innerHTML = '<div class="card report"><h2>گزارش جلسه</h2><p>'+esc(r.summary_fa)+'</p><p><b>سطح:</b> <span dir="ltr">'+esc(r.level_estimate)+'</span></p><h2>نقاط قوت</h2><ul>'+li(r.strengths_fa)+'</ul><h2>نقاط ضعف</h2><ul>'+li(r.weak_points_fa)+'</ul><h2>قدم‌های بعدی</h2><ul>'+li(r.next_steps_fa)+'</ul><div class="row" style="margin-top:16px"><button type="button" class="btn brand" id="rNew">گفتگوی جدید</button></div></div>';
  $('#rNew').onclick = function(){talk.started=false;renderTalk()};
  el.scrollIntoView({behavior:'smooth'});
}

// ============ NOTEBOOK ============
function renderNotes(){
  var h = '<div class="row between"><div><h1>دفترچه اشتباهات</h1><p class="sub">همه‌ی اشتباهات.</p></div><div class="row"><button type="button" class="btn brand" id="drill" '+(mistakes.length?'':'disabled')+'>تمرین</button><button type="button" class="btn ghost" id="clr" '+(mistakes.length?'':'disabled')+'>پاک کردن</button></div></div>';
  h += '<div id="drillBox" style="margin-top:16px"></div><div class="nb" style="margin-top:16px">';
  if(mistakes.length){
    mistakes.forEach(function(m){
      h += '<div class="nbi"><div class="row between"><span dir="ltr"><s style="color:var(--bad)">'+esc(m.original)+'</s> → <b style="color:var(--ok)">'+esc(m.fix)+'</b></span><button type="button" class="mini" data-say="'+esc(m.fix)+'">'+ic('vol')+'</button></div><div>'+esc(m.explain)+'</div><div class="sub" style="font-size:.8rem">'+esc(m.type)+' · '+esc(m.level)+(m.topic?' · '+esc(m.topic):'')+' · '+esc(m.date)+'</div></div>';
    });
  } else {
    h += '<div class="card">هنوز اشتباهی ثبت نشده.</div>';
  }
  h += '</div>';
  $('#main').innerHTML = h;
  var c = $('#clr'); if(c) c.onclick = function(){if(confirm('پاک شود؟')){mistakes=[];store.set('zy_mistakes',mistakes);schedulePushToCloud();renderNotes()}};
  var d = $('#drill'); if(d) d.onclick = function(){
    var box = $('#drillBox');
    box.innerHTML = '<div class="card"><b>در حال ساخت تمرین…</b><div class="skel"></div></div>';
    var src = mistakes.slice(0,15).map(function(m){return 'wrong: '+m.original+' | right: '+m.fix}).join('\n');
    callAI('Create 6 MC exercises practising these mistakes. Return ONLY JSON: {"quiz":[{"q":string,"options":[string,string,string,string],"answer":number,"why_fa":string}]}.', [{role:'user',content:src}], 2500)
      .then(function(raw){
        var j = parseJSON(raw);
        box.innerHTML = '<div class="card"><h2>تمرین شخصی‌سازی‌شده</h2><div id="dq">'+quizHTML(j.quiz)+'</div></div>';
        bindQuiz($('#dq'), j.quiz, function(s,n){award(s*2);$('.qres',$('#dq')).textContent='نتیجه: '+fa(s)+' از '+fa(n)});
      })
      .catch(function(e){box.innerHTML='';toast(errText(e),6000)});
  };
}

// ============ SETTINGS ============
function renderSettings(){
  loadVoices();
  var syncActive = syncEnabled;
  var h = '<h1>تنظیمات</h1>';
  h += '<div class="card stack" style="margin-top:14px"><h3>هوش مصنوعی</h3>';
  h += '<div class="field"><label for="k">کلید API (1xai.ir)</label><input type="password" id="k" dir="ltr" placeholder="1xai-..." value="'+esc(settings.key)+'"></div>';
  h += '<div class="field"><label for="p">آدرس پروکسی</label><input type="text" id="p" dir="ltr" placeholder="https://cors-1xai.zarin-farm1.workers.dev" value="'+esc(settings.proxy||'')+'"></div>';
  h += '<div class="field"><label for="m">مدل</label><select id="m">';
  ['gpt-4o-mini','gpt-4.1-mini','gpt-3.5-turbo','deepseek-chat','claude-3-5-haiku','claude-sonnet-4-6','gemini-2.0-flash-lite','gemini-2.5-flash'].forEach(function(m){
    h += '<option value="'+m+'">'+m+'</option>';
  });
  h += '</select></div>';
  h += '<div class="field"><label for="r">سرعت صدا</label><select id="r"><option value="slow">آهسته</option><option value="normal">عادی</option><option value="fast">سریع</option></select></div>';
  h += '<div class="field"><label for="v">صدای معلم</label><select id="v"><option value="">پیش‌فرض</option>';
  voices.forEach(function(v){h += '<option value="'+esc(v.name)+'">'+esc(v.name)+' ('+esc(v.lang)+')</option>'});
  h += '</select></div>';
  h += '<div class="row"><button type="button" class="btn brand" id="sv">ذخیره</button><button type="button" class="btn ghost" id="ts">آزمایش</button></div></div>';
  h += '<div class="card stack" style="margin-top:16px"><h3>☁️ همگام‌سازی</h3><div class="field"><label for="sc">کد همگام‌سازی</label><input type="password" id="sc" dir="ltr" placeholder="حداقل ۸ کاراکتر" value="'+esc(settings.syncCode||'')+'"></div><label style="display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer"><input type="checkbox" id="sa" '+(settings.syncAuto?'checked':'')+' style="width:16px;height:16px"> ذخیره‌ی خودکار</label><div class="row"><button type="button" class="btn brand" id="scActivate">'+(syncActive?'به‌روزرسانی':'فعال‌سازی')+'</button><button type="button" class="btn ghost" id="scPull">دریافت</button><button type="button" class="btn ghost" id="scPush">ارسال</button></div><div class="sync-status"><span class="sync-dot '+(syncActive?'on':'off')+'"></span>'+(syncActive?'فعال':'غیرفعال')+'</div></div>';
  h += '<div class="card stack" style="margin-top:16px"><h3>📤 صادرات / واردات</h3><div class="row"><button type="button" class="btn brand" id="exBtn">صادرات</button><button type="button" class="btn ghost" id="imBtn">واردات</button></div><div id="exBox" style="display:none"><textarea id="exText" readonly></textarea><button type="button" class="btn ghost" id="exCopy" style="margin-top:8px">کپی</button></div><div id="imBox" style="display:none"><textarea id="imText" placeholder="کد..."></textarea><button type="button" class="btn brand" id="imGo" style="margin-top:8px">وارد کردن</button></div></div>';
  h += '<div class="card stack" style="margin-top:16px"><h3>🗑 پاک کردن داده‌ها</h3><button type="button" class="btn ghost" id="rs">پاک کردن پیشرفت</button></div>';
  $('#main').innerHTML = h;
  $('#m').value = settings.model; $('#r').value = settings.rate; $('#v').value = settings.voice;
  var save = function(){
    settings.key = $('#k').value.trim();
    settings.model = $('#m').value;
    settings.rate = $('#r').value;
    settings.voice = $('#v').value;
    settings.proxy = $('#p').value.trim();
    settings.syncCode = $('#sc').value.trim();
    settings.syncAuto = $('#sa').checked;
    store.set('zy_settings', settings);
  };
  $('#sv').onclick = function(){save(); toast('ذخیره شد.')};
  $('#ts').onclick = function(){
    save();
    callAI('Reply with: ok', [{role:'user',content:'ping'}], 20)
      .then(function(){toast('اتصال موفق ✅')})
      .catch(function(e){toast(errText(e),6000)});
  };
  $('#scActivate').onclick = function(){
    save();
    if(!settings.proxy || !settings.syncCode || settings.syncCode.length<8){toast('پروکسی و کد حداقل ۸ کاراکتر.');return}
    syncEnabled = false;
    initSync().then(function(ok){
      if(ok){ toast('بارگذاری...'); pullFromCloud(true).then(function(){ toast('فعال شد ✅'); renderSettings(); }); }
    });
  };
  $('#scPull').onclick = function(){save(); if(!syncEnabled) initSync().then(function(ok){if(ok)pullFromCloud().then(renderSettings)}); else pullFromCloud().then(renderSettings)};
  $('#scPush').onclick = function(){save(); if(!syncEnabled) initSync().then(function(ok){if(ok)pushToCloud().then(function(){toast('ارسال ✅')})}); else pushToCloud().then(function(){toast('ارسال ✅')})};
  $('#sa').onchange = function(){settings.syncAuto = $('#sa').checked; store.set('zy_settings', settings)};
  $('#exBtn').onclick = function(){try{$('#exText').value=exportData();$('#exBox').style.display='block';$('#imBox').style.display='none'}catch(e){toast('خطا')}};
  $('#imBtn').onclick = function(){$('#imBox').style.display='block';$('#exBox').style.display='none'};
  $('#exCopy').onclick = function(){
    var t = $('#exText'); t.select();
    if(navigator.clipboard) navigator.clipboard.writeText(t.value).then(function(){toast('کپی شد ✅')}).catch(function(){document.execCommand('copy');toast('کپی شد ✅')});
    else {document.execCommand('copy');toast('کپی شد ✅')}
  };
  $('#imGo').onclick = function(){
    try{
      var b64 = $('#imText').value.trim();
      if(!b64){toast('خالی است');return}
      if(!confirm('پیشرفت جایگزین شود؟'))return;
      importData(b64); schedulePushToCloud();
      toast('وارد شد ✅'); updateStats(); go('program');
    }catch(e){toast('کد نامعتبر',5000)}
  };
  $('#rs').onclick = function(){
    if(confirm('پاک شود؟')){
      prog = {xp:0,streak:0,last:'',done:{},program:{}};
      lessonCache = {};
      store.set('zy_lessons',{});
      saveProg();
      toast('پاک شد.');
    }
  };
  updateSyncUI();
}

// ============ INIT ============
document.addEventListener('click', function(e){
  var s = e.target.closest && e.target.closest('[data-say]');
  if(s){speak(s.getAttribute('data-say'));return}
  var p = e.target.closest && e.target.closest('[data-prac]');
  if(p){
    var en = p.getAttribute('data-prac');
    var out = p.closest('.vc').querySelector('.pr');
    if(p.classList.contains('rec')){rec && rec.stop();return}
    p.classList.add('rec'); out.className='pr'; out.textContent='در حال گوش دادن…';
    rec = listen({
      done: function(t){
        p.classList.remove('rec');
        var a = norm(t), b = norm(en);
        if(!a){out.textContent='';return}
        var ok = a===b || a.indexOf(b)>=0 || sim(a,b)>=0.8;
        out.className = 'pr '+(ok?'ok':'no');
        out.textContent = ok?'تلفظ عالی!':'شنیده شد: «'+t+'»';
        if(ok) award(1);
      }
    });
    if(!rec) p.classList.remove('rec');
  }
});

// تب‌ها
$$('.tab').forEach(function(t){
  t.onclick = function(){go(t.getAttribute('data-v'))};
});

// شروع
try{
  updateStats();
  go('program');
  if(settings.proxy && settings.syncCode){
    initSync().then(function(ok){
      if(ok) pullFromCloud(true);
    });
  }
}catch(e){
  console.error('Init error:', e);
  var m = $('#main');
  if(m) m.innerHTML = '<div class="card"><b>خطا در راه‌اندازی</b><p dir="ltr" style="font-family:monospace;font-size:12px">'+esc(e.message)+'</p><button type="button" class="btn brand" onclick="localStorage.clear();location.reload()">پاک کردن داده و رفرش</button></div>';
}
</script>
